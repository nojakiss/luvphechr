<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUVPHECHR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:#050005;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

.text{
    color:#ff4fa3;
    font-size:5vw;
    font-weight:bold;
    letter-spacing:10px;
    animation:
    pop 2s ease forwards,
    blackhole 4s ease 2.5s forwards;
    text-shadow:0 0 20px #ff1493;
}

@keyframes pop{

    0%{
        transform:scale(0);
        opacity:0;
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}


@keyframes blackhole{

    0%{
        transform:scale(1);
    }

    100%{
        transform:scale(20);
        opacity:0;
    }
}


.final{
    position:absolute;
    color:#ff69b4;
    font-size:15vw;
    font-weight:bold;
    opacity:0;
    animation:
    appear 1s ease 6s forwards;
    text-shadow:
    0 0 30px pink;
}


@keyframes appear{

    to{
        opacity:1;
    }
}


.heart{
    position:absolute;
    color:#ff5ca8;
    font-size:20px;
    opacity:0;

    animation:
    hearts 2s ease 7s forwards;

}


@keyframes hearts{

    to{
        opacity:1;
    }

}

</style>

</head>


<body>


<div class="text">
LIVPHECHR
</div>


<div class="final">
LIVPHECHR
</div>



<script>

let symbols = [
"♥","♡","♥","♡"
];


for(let i=0;i<120;i++){

    let h=document.createElement("div");

    h.className="heart";

    h.innerHTML=symbols[
        Math.floor(Math.random()*symbols.length)
    ];

    h.style.left=Math.random()*100+"vw";
    h.style.top=Math.random()*100+"vh";

    h.style.fontSize=
    (10+Math.random()*35)+"px";

    document.body.appendChild(h);

}

</script>


</body>
</html>
